# Blueprint de Render para el servidor de salas del modo Duelo (plan gratuito).
# rootDir: server → Render instala SOLO server/package.json (ws), no Expo ni React Native.
services:
  - type: web
    name: pokequien-rooms
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node room-server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROOM_SERVER_ALLOWED_ORIGINS
        value: "https://bertmarti.github.io"
      - key: ROOM_SERVER_TRUST_PROXY
        value: "1"
