name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (binario oficial con suma de comprobación)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Historial completo y árbol de trabajo
        run: |
          ./gitleaks git . --redact --no-banner -v
          ./gitleaks dir . --redact --no-banner -v

  comprobar:
    name: Tipos, pruebas y build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar sintaxis del servidor de salas
        run: node --check server/room-server.js
      - name: Tipos (tsc --noEmit)
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Verificación del modo solitario
        run: npm run single-player:verify
      - name: Build web (como en Pages)
        run: npm run build:web
      - name: Auditoría de dependencias (informativa)
        run: npm audit --audit-level=critical
